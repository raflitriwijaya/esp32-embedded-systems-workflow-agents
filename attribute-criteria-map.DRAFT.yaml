# DRAFT - attribute to measurable-criterion mapping. NOT IN USE.
#
# Nothing reads this file. It becomes live only when the engineer reviews it,
# sets `approved: true` on the entries that are right, and asks for it to be
# applied. Until then the attribute checks continue to treat every non-RSMR
# attribute as having no measurable criteria.
#
# WHY A DRAFT RATHER THAN A DIRECT EDIT
# Asserting that R-ESP-04 measures Upgradeable is a tier-E3 claim: plausible,
# unevidenced, and about to be machine-enforced. The framework forbids exactly
# that. So each row carries its evidence and waits for a human.
#
# HOW THESE WERE PRODUCED
# One reviewer per attribute, each reading the attribute's own definition from
# quality-attributes.yaml plus all 30 SECTION5 ESP32 criteria, the SECTION3
# sec.4.3 coverage bar, and 37 SECTION6 PIC criteria. Each was asked the strict
# question: if this criterion passes, does that ESTABLISH anything about the
# attribute - or does it merely mention a related word?
#
# THE REJECTIONS ARE THE POINT
# 47 proposed, 117 rejected. A keyword
# search over the same corpus proposed several of the rejected ones - including
# R-ESP-06 for Safety, whose 'controlled shutdown' turns out to be defined
# entirely over storage flushing and says nothing about the state of an
# energized output. Reading the rejections is how you avoid re-litigating them.
#
# HOW TO REVIEW
#   approved: true   - this criterion does measure this attribute
#   approved: false  - it does not; move it to rejected with a reason
#   Adjust `facet` where the reviewer's judgement of the limit differs.
# An attribute whose approved list ends up empty stays UNVERIFIABLE by
# construction, and that is a legitimate outcome to record rather than avoid.

