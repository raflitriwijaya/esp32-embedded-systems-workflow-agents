spec: SECTION5 sec.7.1 (matrix), sec.7.3 (deferral rules); SECTION4 sec.5.4 (debt ceiling)

# Counted from the sec.7.1 matrix itself. Where SECTION5's own Totals
# table disagrees, the matrix governs - see spec-defects.yaml
# `rsmr-totals`. sec.7.2 and sec.7.3 both operate on individual cells.
totals:
  S1: { mandatory: 0, deferrable: 3, not_applicable: 37, total: 40 }
  S2: { mandatory: 5, deferrable: 10, not_applicable: 25, total: 40 }   # SECTION5's Totals table says M=5, D=16, N/A=19 - defective, see rsmr-totals
  S3: { mandatory: 24, deferrable: 8, not_applicable: 8, total: 40 }   # SECTION5's Totals table says M=28, D=12, N/A=0 - defective, see rsmr-totals
  S4: { mandatory: 34, deferrable: 2, not_applicable: 4, total: 40 }   # SECTION5's Totals table says M=38, D=2, N/A=0 - defective, see rsmr-totals
  S5: { mandatory: 40, deferrable: 0, not_applicable: 0, total: 40 }

debt_limits:
  S1:
    max_open: null   # no ceiling at this stage
    rule: "No limit."
  S2:
    max_open: 20
    rule: "≤ 20 open items."
  S3:
    max_open: 10
    rule: "≤ 10 open items. Zero items blocking the next gate."
  S4:
    max_open: 5
    rule: "≤ 5 open items. Zero items at severity ≥ S3."
  S5:
    max_open: 5
    rule: "≤ 5 open items. Zero S1/S2."

