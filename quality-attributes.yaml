# Quality attribute vocabulary and relationship graph.
#
# EXTRACTED MECHANICALLY from the reference below - not paraphrased.
# A graph an LLM restated is a graph that drifts from its source with
# nobody noticing. Regenerate with tools/extract_attrs.py rather than
# editing by hand; `source_sha256` makes a stale copy detectable.
#
# WHAT THIS IS FOR
# SECTION1's stage bar is expressed in RSMR - four of the twelve
# attributes here. SECTION5 supplies measurable criteria for those four
# and for no others. SECTION2's requirements table binds to neither.
# This file is the vocabulary that lets a requirement name what quality
# it is buying, and the conflict graph that shows what it costs.

