# Verified defects in the workflow specification itself.
#
# WHY THIS EXISTS
# Guards check whether the agent's output is wrong. Nothing checks whether the
# output is *faithful to a defective example*. WORKFLOW_SECTION2.md:238 writes
# "stack 4096 words" forty-three lines below its own rule at line 195 that
# ESP-IDF takes bytes. An agent copying that example is behaving exactly as
# instructed, and is wrong. This register is the only mechanism that covers it.
#
# HOW ENTRIES GET HERE
# Each was verified independently against the file, and where it involved
# arithmetic or platform reality, computed or checked against the installed
# ESP-IDF v6.0.2 tree - not reasoned from memory. One further claim
# (a non-atomic counter) was investigated and REJECTED as false; it is recorded
# in `rejected:` so nobody re-raises it.
#
# LIFECYCLE
# `digest: true` entries are injected into every session. When a defect is
# fixed in the specification, delete the entry - the digest count drops and
# says why, the same fail-loud behaviour as the version-bound notes block.
#
# REVIEW TRIGGER (invariant I2)
# This is a curated fact list, which is the thing I2 warns against. It must be
# re-verified whenever WORKFLOW_SECTION2.md changes. `spec_sha256` below is
# what makes a stale register detectable rather than silently trusted.

source: workflow-iot/WORKFLOW_SECTION2.md
sources:            # further specification files this register covers
  - path: workflow-iot/WORKFLOW_SECTION3.md
    sha256: d0ec7e10d93bfd7a90a33a04bff02cf4f5a7b00f6d195c0bd455e257e5cf5d8f
  - path: workflow-iot/WORKFLOW_SECTION5.md
    sha256: 79619c2a50410e17ee1f0499880277a2ff9121b2a444183f5a209a710017f9d3
verified_on: 2026-08-26
verified_against: ESP-IDF v6.0.2 (C:/esp/v6.0.2/esp-idf)
spec_sha256: 76265220fbd4816f84027220ed8c294b018d54fff1191eb01fa5593da524f9a9

defects:

  # --- traps: copying the specification faithfully produces wrong output -----

  - id: stack-words
    lines: [238, 242, 941, 974]
    class: trap
    digest: true
    says: "stack 4096 words / stack 3072 words, in an ESP32 example"
    correct: >-
      ESP-IDF takes BYTES. Verified in the installed tree:
      components/freertos/FreeRTOS-Kernel/include/freertos/task.h:315 -
      "usStackDepth The size of the task stack specified as the NUMBER OF
      BYTES. Note that this differs from vanilla FreeRTOS." Line 195 of the
      spec states the rule correctly; 238 and 242 contradict it 43 lines later.
      Lines 911-913 and 966-971 use "words" legitimately - that block is
      declared STM32/CMSIS-RTOS v2.

  - id: header-size
    lines: [1402]
    class: trap
    digest: true
    says: 'struct.pack(">BBHBBI", ...) for a frame whose MSG_HEADER_SIZE is 7'
    correct: >-
      calcsize(">BBHBBI") is 10, not 7. Worse than a size mismatch: `length`
      lands on a 1-byte 'B', so struct.error is raised for any frame over 255
      bytes, and every field after Magic is misaligned. The format matching the
      wire diagram at lines 787-790 is ">BBBHBB" (calcsize 7).

  - id: struct-size
    lines: [853]
    class: trap
    digest: true
    says: "sensor_reading_t is 12 bytes"
    correct: >-
      True size is 24 under normal alignment (enum 4 + int32 4 + uint64 8
      requiring 8-byte alignment + uint16 2 + padding). 12 is unreachable on any
      ABI. Sizing a FreeRTOS queue from 12 truncates every element.

  - id: sht30-addr
    lines: [151, 413, 1036, 1273]
    class: trap
    digest: true
    says: "#define SHT30_I2C_ADDR 0x76"
    correct: >-
      0x76 is the BMP280/BME280 address. SHT3x is 0x44 (ADDR low) or 0x45
      (ADDR high). Four sites carry it, and the surrounding comment claims ADDR
      is tied to GND - which for an SHT3x means 0x44.

  - id: fromisr-timer
    lines: [1136, 1139]
    class: trap
    digest: true
    says: "a ...FromISR call inside a FreeRTOS software timer callback"
    correct: >-
      Timer callbacks run in the timer service task, not in an interrupt. The
      FromISR variants and their higher-priority-task-woken plumbing are wrong
      there; use the task-context API.

  - id: coex-kconfig
    lines: [201, 229]
    class: trap
    digest: true
    says: "CONFIG_SW_COEXIST_ENABLE"
    correct: >-
      The symbol in ESP-IDF v6.0.2 is CONFIG_ESP_COEX_SW_COEXIST_ENABLE.
      Confirmed by grepping components/**/Kconfig* in the installed tree: only
      `config ESP_COEX_SW_COEXIST_ENABLE` is defined. The stale name evaluates
      false and silently leaves coexistence unconfigured. NOTE: the same stale
      symbol also appears in SECTION3 (3 sites) and SECTION5 (1 site).

  # --- errors that mislead but do not survive a build ------------------------

  - id: length-field
    lines: [800]
    class: wrong-reason
    digest: false
    says: "Max message size 65520 bytes (limited by 16-bit Length field)"
    correct: >-
      A 16-bit Length field permits 65535. The stated cause is false even
      though a cap may be desirable for other reasons; the number and its
      justification do not agree.

  - id: pta-pti
    lines: [202]
    class: wrong-reason
    digest: false
    says: "PTI (Packet Traffic Arbitration)"
    correct: >-
      Packet Traffic Arbitration is PTA. PTI is a Silicon Labs term and does
      not belong in an Espressif context.

  - id: component-yml
    lines: [182]
    class: wrong-reason
    digest: false
    says: "Add via idf_component_yml"
    correct: "The manifest is idf_component.yml. Line 211 spells it correctly."

  # --- structural gaps in the specification ----------------------------------

  - id: req-collision
    lines: [59, 213, 224, 236, 301, 305]
    class: structural
    digest: false
    says: "several REQ-S2-xxx ids carry two or more different meanings"
    correct: >-
      Four ids are hard collisions. Every REQ id must denote exactly one
      requirement, or the traceability chain SECTION1 sec.5 depends on cannot
      resolve.

  - id: undeclared-fn
    lines: [678]
    class: structural
    digest: false
    says: "hal_time_get_us() is called but declared in no header"
    correct: >-
      sec.5.4 defines only hal_sensor.h. hal_time.h, hal_comm.h and
      hal_storage.h appear in the sec.5.1 diagram and are never specified.

  - id: sec5-stagescale
    lines: [423]
    class: structural
    digest: false
    says: "section 5 has no stage-scaling subsection"
    correct: >-
      Sections 2, 3, 4, 6 and 7 each carry one. Section 5 is the only major
      section without, so firmware architecture has no declared stage bar.

  - id: claudemd-refs
    lines: [1589, 1590]
    class: structural
    digest: false
    says: "sec.8 cites CLAUDE.md sec.2 and sec.5 as authority"
    correct: >-
      CLAUDE.md contains no numbered sections at all - only [SYSTEM] and
      [CONSTRAINTS] markers. Both checklist items are dangling references and
      can be MACHINE_REFUTED today.

  # --- SECTION5: a derived summary that contradicts the table it summarises ---

  - id: rsmr-totals
    source: workflow-iot/WORKFLOW_SECTION5.md
    lines: [535, 539, 540, 541, 542, 543]
    class: structural
    digest: false
    says: >-
      the sec.7 Totals table declares Stage 2 = 5 M / 16 D / 19 N-A,
      Stage 3 = 28 M / 12 D / 0 N-A, Stage 4 = 38 M / 2 D / 0 N-A
    correct: >-
      Counted mechanically from the sec.7.1 matrix the table summarises
      (tools/extract_rsmr.py, which refuses to write its output when the two
      disagree): Stage 2 is 5 M / 10 D / 25 N-A, Stage 3 is 24 M / 8 D / 8 N-A,
      Stage 4 is 34 M / 2 D / 4 N-A. Stages 1 and 5 match exactly.

      The matrix is the correct artifact and the summary is the defective one.
      Three findings support that. First, the matrix is internally sound: all
      40 rows are monotonic under N-A < D < M, so no criterion ever weakens as
      the stage advances. Second, the discrepancies are not scattered - the
      Totals table reports 0 N-A at both Stage 3 and Stage 4, and the surplus it
      assigns to M and D is exactly the 8 and 4 rows that the matrix marks N-A
      there. Third, those rows are self-evidently inapplicable before Stage 5:
      "Fleet MTBF vs. predicted comparison" and "Fleet config drift monitoring"
      cannot be assessed on a pre-production unit. The summary appears to have
      been computed as though N-A ceased to exist past Stage 2.

      Consequence if the Totals table is trusted: an agent would demand four
      more Mandatory criteria at Gate 3->4 than the matrix requires, and would
      demand fleet-scale evidence from a project that has no fleet. sec.7.2 and
      sec.7.3 both operate on individual cells, so the matrix governs.

  - id: scorecard-vs-matrix
    source: workflow-iot/WORKFLOW_SECTION5.md
    lines: [366, 486]
    class: structural
    digest: false
    says: >-
      sec.7.2 step 3 instructs the reviewer to check "every Mandatory criterion
      against the scorecard (sec.6.2)"
    correct: >-
      The sec.6.2 scorecard template carries 22 criterion rows, four of them
      "[Platform-specific criteria ...]" placeholders, against the sec.7.1
      matrix of 40. At Stage 3 alone the matrix makes 24 criteria Mandatory, so
      the reviewer is told to check them against a form that has no row for
      several of them - fault-injection testing, HardFault/panic handler,
      CHANGELOG updated per change, and thermal budget measured among them.

      Two scorecard rows also collapse a pair of matrix rows into one line.
      "R-02: Watchdog coverage verified" stands for both "Watchdog implemented"
      and "Watchdog tested (induced hang -> reset)", which the matrix marks
      Mandatory at different stages; one line cannot record a PASS on the first
      and a FAIL on the second.

      Counted mechanically, not judged: 22 rows against 40, four of the 22 being
      placeholders. Which specific rows map to which is a matter of reading, and
      is deliberately not asserted here.

      Handled by generating the scorecard from the matrix rather than mapping
      across the mismatch - `stage_kernel.py rsmr-scorecard`. The sec.6.2 header
      fields are kept, so the artifact is still the one sec.6.3 governs.

  # --- SECTION3: traps verified against the installed ESP-IDF v6.0.2 tree ----

  - id: idf-version-pin-v53
    source: workflow-iot/WORKFLOW_SECTION3.md
    lines: [2009, 2010]
    class: trap
    digest: true
    says: >-
      set(ESP_IDF_REQUIRED_MAJOR 5) / set(ESP_IDF_REQUIRED_MINOR 3) in the
      sec.6.2 "ESP-IDF version pinning in CMakeLists.txt" sample
    correct: >-
      The document pins v6.0.2 throughout and the table directly above this
      sample states "Pinning is non-negotiable". The sample pins v5.3. Copying
      it produces a build that FAILS on the correct toolchain and passes only
      on the wrong one - the safety mechanism installed backwards.

      Verified: tools/cmake/version.cmake in the installed tree reads
      set(IDF_VERSION_MAJOR 6) / set(IDF_VERSION_MINOR 0).

      Second defect in the same sample, and the worse of the two. The check runs
      BEFORE include($ENV{IDF_PATH}/tools/cmake/project.cmake), and
      IDF_VERSION_MAJOR is never in scope there. Across the whole of
      tools/cmake it is set in exactly one file, version.cmake, which is
      included only by scripts/component_get_requirements.cmake - a separate
      cmake script run, not the app's scope. Executed with real CMake 4.0.3 the
      sample prints "ESP-IDF v5.3 required. Detected: v." - an empty version.

      The correct form includes version.cmake explicitly, and was verified to
      read v6.0.2, accept a v6.0 pin and reject a v5.3 one:

        include($ENV{IDF_PATH}/tools/cmake/version.cmake)
        set(ESP_IDF_REQUIRED_MAJOR 6)
        set(ESP_IDF_REQUIRED_MINOR 0)
        if(NOT (IDF_VERSION_MAJOR EQUAL ESP_IDF_REQUIRED_MAJOR
                AND IDF_VERSION_MINOR EQUAL ESP_IDF_REQUIRED_MINOR))
            message(FATAL_ERROR "...")
        endif()
        include($ENV{IDF_PATH}/tools/cmake/project.cmake)

  - id: stack-words-s3
    source: workflow-iot/WORKFLOW_SECTION3.md
    lines: [206, 285, 330, 340, 350, 2111]
    class: trap
    digest: true
    says: >-
      "stack depth (words)" on three xTaskCreatePinnedToCore calls, plus
      "stack size (words)" in the sec.2.1 prose, sec.2.2 step 6 and the sec.7
      checklist
    correct: >-
      ESP-IDF takes BYTES, per components/freertos/FreeRTOS-Kernel/include/
      freertos/task.h:315 in the installed tree - "the NUMBER OF BYTES. Note
      that this differs from vanilla FreeRTOS."

      More convincing here than in SECTION2 because the arithmetic is
      internally consistent: "3072, // stack depth (words) - measured 2048 peak
      + 50% margin" is correct as a words calculation. An engineer who checks
      the maths finds it right and is still wrong by a factor of four.

  - id: core-requires-driver
    source: workflow-iot/WORKFLOW_SECTION3.md
    lines: [282]
    class: trap
    digest: true
    says: >-
      core/CMakeLists.txt declaring REQUIRES driver, with the comment
      "for sensor types enum - no platform dependency"
    correct: >-
      The comment refutes itself. `driver` is an ESP-IDF platform component;
      the installed tree exposes driver/i2c.h, driver/twai.h and
      driver/touch_pad.h from components/driver. A core/ that REQUIRES it
      cannot compile for the host, which is what sec.4.2 requires from Stage 2
      and what sec.4.3 measures coverage on. The seam sec.2.0 and sec.3.1 exist
      to establish is broken inside the sample that teaches it.

  - id: sw-coexist-s3
    source: workflow-iot/WORKFLOW_SECTION3.md
    lines: [255, 381, 951]
    class: trap
    digest: false
    says: CONFIG_SW_COEXIST_ENABLE
    correct: >-
      The symbol in ESP-IDF v6.0.2 is CONFIG_ESP_COEX_SW_COEXIST_ENABLE, read
      from components/esp_coex/Kconfig in the installed tree. A CONFIG_ symbol
      that does not exist evaluates false, so coexistence is silently never
      enabled. Same defect as the SECTION2 entry; recorded separately because
      the kconfig-exists guard cites line numbers per file.

  - id: gcc-version
    source: workflow-iot/WORKFLOW_SECTION3.md
    lines: [232, 777, 1996, 1998, 1999]
    class: wrong-reason
    digest: false
    says: >-
      "Toolchain is GCC 15.1.0", and the sec.6.2 pinning table repeats it twice
    correct: >-
      ESP-IDF v6.0.2 uses GCC 15.2.0. tools/tools.json marks
      esp-15.2.0_20251204 as the recommended xtensa-esp-elf version, and it is
      the only toolchain installed. sec.6.2's own rule makes this a finding
      against itself: "a document that pins one version while the workstation
      runs another is itself a gate finding". A Dockerfile or CI image built to
      the table would not match the workstation.

  - id: brownout-lvl-sel
    source: workflow-iot/WORKFLOW_SECTION5.md
    lines: [104]
    class: trap
    digest: true
    says: "check sdkconfig: CONFIG_ESP_BROWNOUT_DET_LVL_SEL=0 (2.43V +/- 0.05V for ESP32)"
    correct: >-
      The voltage is right and the symbol form is wrong. In v6.0.2 the brownout
      level is a Kconfig choice, so the symbols are booleans -
      CONFIG_ESP_BROWNOUT_DET_LVL_SEL_0 through _SEL_7, one of them =y. There is
      no CONFIG_ESP_BROWNOUT_DET_LVL_SEL taking a value. Verified in
      components/esp_hw_support/power_supply/port/esp32/Kconfig.power:15-42,
      where SEL_0 is indeed labelled "2.43V +/- 0.05".

      R-ESP-06 is an acceptance criterion, so an engineer applying it literally
      greps for a symbol that cannot appear and either fails the criterion or
      hand-writes a dead symbol into sdkconfig. The reference project here
      carries CONFIG_ESP_BROWNOUT_DET_LVL_SEL_7=y - 2.80V, not 2.43V.

      Worth knowing when citing the number: the Kconfig help says of these
      levels, "The voltage levels here are estimates, more work needs to be done
      to figure out the exact voltages of the brownout threshold levels." It is
      ESP-IDF's estimate, not a datasheet guarantee.

# Investigated and found NOT to be defects. Recorded so they are not re-raised.
rejected:
  - id: nonatomic-counter
    claim: "a dropped-sample counter is incremented from two contexts unguarded"
    finding: >-
      Verified false. The claim does not hold against the text as written.
      Copying it into the register would have introduced a fabricated defect
      into the mechanism built to prevent fabrication.
